[tasks.build-dev]
private = true
condition = { profiles = ["development"] }
command = "cargo"
args = ["build", "-F", "dev"]
# dependencies = ["clean"]

[tasks.build-prod]
private = true
condition = { profiles = ["production"] }
command = "cargo"
args = ["build", "--release"]
# dependencies = ["clean"]

[tasks.build]
clear = true
dependencies = ["build-dev", "build-prod"]

[tasks.run-dev]
private = true
condition = { profiles = ["development"] }
command = "cargo"
args = ["run", "-F", "dev", "--", "${@}"]

[tasks.run-prod]
private = true
condition = { profiles = ["production"] }
command = "cargo"
args = ["run", "--release", "--", "${@}"]

[tasks.run]
clear = true
dependencies = ["run-dev", "run-prod"]

[tasks.test-dev]
private = true
condition = { profiles = ["development"] }
command = "cargo"
args = ["test", "-F", "dev", "${@}"]

[tasks.test-prod]
private = true
condition = { profiles = ["production"] }
command = "cargo"
args = ["test", "--release", "${@}"]

[tasks.test]
clear = true
dependencies = ["test-dev", "test-prod"]
